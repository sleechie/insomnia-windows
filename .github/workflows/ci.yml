name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Core tests
        run: dotnet test tests/Insomnia.Core.Tests -c Release
      - name: Build the Windows app (cross-compiled)
        run: dotnet publish src/Insomnia/Insomnia.csproj -c Release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Insomnia-win-x64
          path: |
            dist/Insomnia.exe
            scripts/install.ps1
            scripts/uninstall.ps1
